
name: Build Insular Enhanced APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :assembly:assembleCompleteFdroidDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insular-enhanced-debug-apk
          path: assembly/build/outputs/apk/completeFdroid/debug/assembly-complete-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 7
